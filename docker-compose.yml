name: three_lans_system

services:
  viewer:
    build: .
    container_name: trilingual-viewer
    depends_on:
      - ocr
      - tts-en
      - tts-ja
    environment:
      - PORT=3010
      - WORKSPACE_MODE=${WORKSPACE_MODE:-owner}
      - PUBLIC_FEEDBACK_URL=${PUBLIC_FEEDBACK_URL:-}
      - DEPLOYMENT_EXPOSURE=${DEPLOYMENT_EXPOSURE:-local}
      - OWNER_GATEWAY_PROTECTED=${OWNER_GATEWAY_PROTECTED:-false}
      - SANDBOX_INSTANCE_ID=${SANDBOX_INSTANCE_ID:-}
      - SANDBOX_STORAGE_ROOT=${SANDBOX_STORAGE_ROOT:-/data/sandboxes}
      - SANDBOX_WRITE_ENABLED=${SANDBOX_WRITE_ENABLED:-false}
      - SANDBOX_HIGH_COST_ENABLED=${SANDBOX_HIGH_COST_ENABLED:-false}
      - SANDBOX_RETENTION_HOURS=${SANDBOX_RETENTION_HOURS:-24}
      - RECORDS_PATH=/data/trilingual_records
      - RECORDS_TIMEZONE=${RECORDS_TIMEZONE:-Asia/Shanghai}
      - LEARNING_TIMEZONE=${LEARNING_TIMEZONE:-Asia/Tokyo}
      - DB_PATH=/data/trilingual_records/trilingual_records.db
      - TEXTBOOK_FEATURE_ENABLED=${TEXTBOOK_FEATURE_ENABLED:-true}
      - KG_ENABLED=${KG_ENABLED:-0}
      - KG_PLANNING_ENABLED=${KG_PLANNING_ENABLED:-0}
      - KG_LLM_ENRICHMENT_ENABLED=${KG_LLM_ENRICHMENT_ENABLED:-0}
      - KG_INCREMENTAL_SYNC_ENABLED=${KG_INCREMENTAL_SYNC_ENABLED:-0}
      - CARD_ANNOTATIONS_ENABLED=${CARD_ANNOTATIONS_ENABLED:-1}
      - TEXTBOOK_SOURCE_ROOT=/media/textbooks
      - TEXTBOOK_WORK_PATH=/data/textbooks
      - SQLITE_BUSY_TIMEOUT_MS=${SQLITE_BUSY_TIMEOUT_MS:-5000}
      - SQLITE_BUSY_RETRY_MAX=${SQLITE_BUSY_RETRY_MAX:-3}
      - SQLITE_BUSY_RETRY_BASE_MS=${SQLITE_BUSY_RETRY_BASE_MS:-25}
      - GENERATION_WORKER_SHUTDOWN_TIMEOUT_MS=${GENERATION_WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      - SELECTION_TTS_ENABLED=${SELECTION_TTS_ENABLED:-true}
      - SELECTION_TTS_CACHE_PATH=/data/selection_tts_cache
      - SELECTION_TTS_MAX_CHARS=${SELECTION_TTS_MAX_CHARS:-300}
      - SELECTION_TTS_TIMEOUT_MS=${SELECTION_TTS_TIMEOUT_MS:-15000}
      - SELECTION_TTS_MAX_CONCURRENCY=${SELECTION_TTS_MAX_CONCURRENCY:-2}
      - SELECTION_TTS_CACHE_TTL_HOURS=${SELECTION_TTS_CACHE_TTL_HOURS:-168}
      - SELECTION_TTS_CACHE_MAX_BYTES=${SELECTION_TTS_CACHE_MAX_BYTES:-268435456}
      - SELECTION_TTS_MAX_RESPONSE_BYTES=${SELECTION_TTS_MAX_RESPONSE_BYTES:-10485760}
      - PRONUNCIATION_OVERLAY_ENABLED=${PRONUNCIATION_OVERLAY_ENABLED:-true}
      - PRONUNCIATION_ACTIONS_ENABLED=${PRONUNCIATION_ACTIONS_ENABLED:-true}
      - PRONUNCIATION_LEGACY_RUBY_READER_ENABLED=${PRONUNCIATION_LEGACY_RUBY_READER_ENABLED:-true}
      - PRONUNCIATION_TELEMETRY_ENABLED=${PRONUNCIATION_TELEMETRY_ENABLED:-true}
      - CARD_READER_V3_SHADOW_ENABLED=${CARD_READER_V3_SHADOW_ENABLED:-true}
      - CARD_READER_V3_SHADOW_MAX_MARKDOWN_CHARS=${CARD_READER_V3_SHADOW_MAX_MARKDOWN_CHARS:-200000}
      - CARD_READER_V3_CANARY_ENABLED=${CARD_READER_V3_CANARY_ENABLED:-true}
      - CARD_READER_V3_CANARY_GENERATION_IDS=${CARD_READER_V3_CANARY_GENERATION_IDS:-1040,1039,1038}
      - TTS_SHARED_MAX_CONCURRENCY=${TTS_SHARED_MAX_CONCURRENCY:-2}
      - TTS_BATCH_STARVATION_MS=${TTS_BATCH_STARVATION_MS:-5000}
      - OCR_PROVIDER=tesseract
      - OCR_TESSERACT_ENDPOINT=http://ocr:8080/ocr
      - OCR_LANGS=eng+jpn+chi_sim
      - OCR_TIMEOUT_MS=20000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - DEEPSEEK_TIMEOUT_MS=${DEEPSEEK_TIMEOUT_MS:-120000}
      - DEEPSEEK_THINKING=${DEEPSEEK_THINKING:-disabled}
      - LOCAL_GLOSSARY_LLM_ENABLED=${LOCAL_GLOSSARY_LLM_ENABLED:-1}
      - TTS_EN_ENDPOINT=http://tts-en:8000/v1/audio/speech
      - TTS_EN_TYPE=kokoro
      - TTS_EN_SPEED=1.0
      - TTS_EN_VOICE=af_bella
      - TTS_EN_MODEL=hexgrad/Kokoro-82M
      - HTML_RENDER_MODE=local
      - TTS_JA_ENDPOINT=${TTS_JA_ENDPOINT:-http://tts-ja:50021}
      - TTS_JA_TYPE=${TTS_JA_TYPE:-voicevox}
      - TTS_JA_SBV2_ENDPOINT=${TTS_JA_SBV2_ENDPOINT:-}
      - TTS_JA_SBV2_MODEL_ID=${TTS_JA_SBV2_MODEL_ID:-0}
      - TTS_JA_SBV2_MODEL_NAME=${TTS_JA_SBV2_MODEL_NAME:-}
      - TTS_JA_SBV2_SPEAKER_ID=${TTS_JA_SBV2_SPEAKER_ID:-0}
      - TTS_JA_SBV2_SPEAKER_NAME=${TTS_JA_SBV2_SPEAKER_NAME:-}
      - TTS_JA_SBV2_STYLE=${TTS_JA_SBV2_STYLE:-Neutral}
      - VOICEVOX_SPEAKER=${VOICEVOX_SPEAKER:-2}
    ports:
      - "${VIEWER_BIND_ADDRESS:-127.0.0.1}:3010:3010"
    volumes:
      - trilingual_records:/data/trilingual_records
      - ${TEXTBOOK_SOURCE_PATH:-./data/textbook_sources}:/media/textbooks:ro
      - textbook_work:/data/textbooks
      - selection_tts_cache:/data/selection_tts_cache
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ocr:
    build:
      context: ./ocr_service
    container_name: trilingual-ocr
    environment:
      - OCR_LANGS=eng+jpn+chi_sim
      - OCR_TIMEOUT_SEC=20
      - OCR_PSM=6
      - OCR_OEM=1
    restart: unless-stopped

  tts-en:
    image: dlaszlo/speech-service:cpu-latest
    container_name: trilingual-tts-en
    environment:
      - STT_MODEL_NAME=Systran/faster-distil-whisper-small.en
      - STT_COMPUTE_TYPE=int8
      - TTS_MODEL_NAME=hexgrad/Kokoro-82M
      - TTS_LANG_CODE=a
      - HF_HOME=/data/huggingface
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - kokoro_cache:/data/huggingface
    restart: unless-stopped

  tts-ja:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: trilingual-tts-ja
    # Apple Silicon 如拉取失败，可尝试指定 platform: linux/arm64
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:50021:50021"
    restart: unless-stopped

  tts-ja-sbv2:
    # Archived experiment: retained for reference only. Use VOICEVOX for normal Japanese TTS.
    profiles: ["archived-sbv2"]
    build:
      context: ./tts/style-bert-vits2
    container_name: trilingual-tts-ja-sbv2
    environment:
      - SBV2_DEVICE=${SBV2_DEVICE:-cpu}
      - SBV2_MODEL_ROOT=/models/model_assets
      - SBV2_MODEL_REPO=${SBV2_MODEL_REPO:-litagin/style_bert_vits2_jvnv}
      - SBV2_MODEL_NAME=${SBV2_MODEL_NAME:-jvnv-F1-jp}
      - SBV2_MODEL_FILE=${SBV2_MODEL_FILE:-jvnv-F1-jp/jvnv-F1-jp_e160_s14000.safetensors}
      - SBV2_CONFIG_FILE=${SBV2_CONFIG_FILE:-jvnv-F1-jp/config.json}
      - SBV2_STYLE_FILE=${SBV2_STYLE_FILE:-jvnv-F1-jp/style_vectors.npy}
      - SBV2_BERT_MODEL=${SBV2_BERT_MODEL:-ku-nlp/deberta-v2-large-japanese-char-wwm}
      - SBV2_BERT_CACHE_DIR=/models/bert
      - SBV2_ENABLE_OPENJTALK_WORKER=${SBV2_ENABLE_OPENJTALK_WORKER:-false}
      - SBV2_HOST=0.0.0.0
      - SBV2_PORT=5000
      - HF_HOME=/models/huggingface
    volumes:
      - sbv2_models:/models
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${SBV2_HOST_PORT:-15000}:5000"
    restart: unless-stopped

volumes:
  kokoro_cache:
  sbv2_models:
  trilingual_records:
  textbook_work:
  selection_tts_cache:
